name: Playwright Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: playwright-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Smoke tests (PR)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: olm_playwright_tests
    env:
      CI: true
      OLM_USERNAME: ${{ secrets.OLM_USERNAME }}
      OLM_PASSWORD: ${{ secrets.OLM_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: olm_playwright_tests/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Run smoke tests
        run: npm run test:smoke

      - name: Upload report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-smoke-report
          path: |
            olm_playwright_tests/reports/
            olm_playwright_tests/test-results/
          retention-days: 14

  full:
    name: Full test suite (main)
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    defaults:
      run:
        working-directory: olm_playwright_tests
    env:
      CI: true
      OLM_USERNAME: ${{ secrets.OLM_USERNAME }}
      OLM_PASSWORD: ${{ secrets.OLM_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: olm_playwright_tests/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Run full test suite
        run: npm test

      - name: Upload report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-full-report
          path: |
            olm_playwright_tests/reports/
            olm_playwright_tests/test-results/
          retention-days: 30
